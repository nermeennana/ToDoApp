<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<title>Todo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    background: #eef1f5;
    margin: 0;
    padding: 40px 20px;
  }

  .card {
    max-width: 560px;
    margin: 0 auto;
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    padding: 28px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: 28px;
    margin: 0;
    color: #1a1a1a;
  }
  .header button {
    background: #1a1a1a;
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 14px;
    cursor: pointer;
  }
  .header button:hover { background: #333; }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }
  .filters select {
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 13px;
    background: #fafafa;
  }

  .filter-label {
    flex-basis: 100%;
    font-weight: 700;
    margin-top: 8px;
  }

  .filter-row {
    flex-basis: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  } 

  .section-label {
    font-weight: bold;
    font-size: 20px;
    color: #333;
    margin: 22px 0 12px;
  }

  .section-label .count {
    font-size: 14px;
    font-weight: normal;
    color: #999;
    margin-left: 6px;
  }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 14px;
    border: 1px solid #eee;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }

  .circle {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 3px solid;
    flex-shrink: 0;
    cursor: pointer;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .circle.priority-High { border-color: #e0453b; }
  .circle.priority-Medium { border-color: #33b8e0; }
  .circle.priority-Low { border-color: #5b4fe0; }

  .circle.done {
    background: #b9b3f7;
    border-color: #b9b3f7;
    color: #fff;
    font-size: 13px;
  }

  .todo-body { flex: 1; min-width: 0; }
  .todo-title {
    font-weight: bold;
    font-size: 17px;
    color: #1a1a1a;
    margin-bottom: 2px;
  }
  .todo-title.done {
    text-decoration: line-through;
    color: #c3c3c3;
  }
  .todo-sub {
    font-size: 14px;
    color: #999;
  }
  .todo-sub.done { color: #d5d5d5; }

  .tags { display: flex; gap: 6px; flex-shrink: 0; }
  .tag {
    background: #f2f2f4;
    color: #555;
    font-weight: 600;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .tag.done { color: #d5d5d5; }

  .delete-btn {
    background: none;
    border: none;
    color: #ccc;
    font-size: 16px;
    cursor: pointer;
    padding: 4px;
  }
  .delete-btn:hover { color: #e0453b; }

  #errorBox {
    display: none;
    background: #fdecea;
    color: #a32b23;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 15px;
    font-size: 14px;
  }

  .empty { text-align: center; color: #aaa; padding: 20px; font-size: 14px; }

  .add-panel {
    display: none;
    border: 1px solid #eee;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 18px;
    background: #fafafa;
  }
  .add-panel.open { display: block; }
  .add-panel input, .add-panel select {
    width: 100%;
    padding: 10px;
    margin-bottom: 8px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 14px;
  }
  .add-panel .row { display: flex; gap: 8px; }
  .add-panel .row > * { flex: 1; }
  .add-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  .add-actions button {
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 14px;
  }
  .btn-save { background: #1a1a1a; color: #fff; }
  .btn-cancel { background: #eee; color: #333; }
  .edit-form input, .edit-form select {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 14px;
    margin-bottom: 8px;
  }
  .edit-row { display: flex; gap: 8px; }
  .edit-row > * { flex: 1; }
  .edit-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .edit-actions button {
    padding: 6px 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 13px;
  }

  /* ===== SignalR toast notification ===== */
  #toast {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #1a1a1a;
    color: #fff;
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    opacity: 0;
    transform: translateY(-10px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 1000;
    pointer-events: none;
  }
  #toast.show {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>
<body>

<div id="toast"></div>

<div class="card">
  <div class="header">
    <h1>Todo</h1>
    <div style="display: flex; gap: 8px; align-items: center;">
      <span id="userName" style="color: #999; font-size: 14px;"></span>
      <a href="activity-log.html" style="background: #eee; color: #333; padding: 12px 20px; border-radius: 12px; font-size: 14px; text-decoration: none;">Activity log</a>
      <button onclick="toggleAddPanel()">Create Reminder</button>
      <button onclick="logout()" style="background: #eee; color: #333;">Log out</button>
    </div>
  </div>

  <div id="errorBox"></div>

  <div class="add-panel" id="addPanel">
    <input type="text" id="newTitle" placeholder="Title">
    <input type="text" id="newDescription" placeholder="Description (optional)">
    <div class="row">
      <select id="newPriority">
        <option value="">Priority</option>
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
      </select>
      <label for="newDueDate">Due date</label>
      <input type="date" id="newDueDate">
    </div>
    <div class="add-actions">
      <button class="btn-cancel" onclick="toggleAddPanel()">Cancel</button>
      <button class="btn-save" onclick="addTodo()">Save</button>
    </div>
  </div>

  <div class="filters">
    <div class="filter-label">Filters</div>

    <div class="filter-row">
      <select id="filterStatus">
        <option value="">All statuses</option>
        <option value="Pending">Pending</option>
        <option value="InProgress">InProgress</option>
        <option value="Completed">Completed</option>
      </select>
    
      <select id="filterPriority">
        <option value="">All priorities</option>
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
      </select>
    </div>
    
    <div class="filter-row">
      <label for="filterFromDueDate">Due from</label>
      <input type="date" id="filterFromDueDate">

      <label for="filterToDueDate">Due to</label>
      <input type="date" id="filterToDueDate">
    </div>

    <div class="filter-label">Sorting</div>

    <select id="sortBy">
      <option value="">No sorting</option>
      <option value="Title">Title</option>
      <option value="Priority">Priority</option>
      <option value="CreatedDate">Created date</option>
      <option value="DueDate">Due date</option>
    </select>

    <select id="sortDirection">
      <option value="Asc">Ascending</option>
      <option value="Desc">Descending</option>
    </select>

    <div class="filter-label">
      <button onclick="loadTodos()">Apply</button>
    </div>

  </div>

  <div class="section-label">Pending <span class="count" id="pendingCount"></span></div>
  <div id="activeList"></div>

  <div class="section-label">Completed <span class="count" id="completedCount"></span></div>
  <div id="completedList"></div>

</div>

<script>
  // Change this URL if your API runs on a different port
  const API_BASE = "http://localhost:5093/api/ToDo";
  const token = localStorage.getItem("token");
  if (!token) window.location.href = "login.html";

  async function apiFetch(url, options = {}) {
    const res = await fetch(url, {
      ...options,
      headers: { ...(options.headers || {}), Authorization: `Bearer ${token}` }
    });
    if (res.status === 401) {
      logout();
      throw new Error("Your session has expired.");
    }
    return res;
  }

  function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("displayName");
    window.location.href = "login.html";
  }
  document.getElementById("userName").textContent = "Hi, " + (localStorage.getItem("displayName") || "");
  let editingId = null;
  let currentTodos = [];

  function showError(msg) {
    const box = document.getElementById("errorBox");
    box.textContent = msg;
    box.style.display = "block";
    setTimeout(() => box.style.display = "none", 6000);
  }

  function toggleAddPanel() {
    document.getElementById("addPanel").classList.toggle("open");
  }

  function buildQuery() {
    const params = new URLSearchParams();
    const status = document.getElementById("filterStatus").value;
    const priority = document.getElementById("filterPriority").value;
    const sortBy = document.getElementById("sortBy").value;
    const sortDirection = document.getElementById("sortDirection").value;
    const fromDate = document.getElementById("filterFromDueDate").value;
    const toDate = document.getElementById("filterToDueDate").value;

    if (status) params.append("status", status);
    if (priority) params.append("priority", priority);
    if (sortBy) params.append("sortBy", sortBy);
    if (sortBy) params.append("sortDirection", sortDirection);
    if (fromDate) params.append("fromDate", fromDate);
    if (toDate) params.append("toDate", toDate);

    return params.toString();
  }

  function formatDueLabel(dueDate) {
    if (!dueDate) return "";
    const today = new Date();
    const d = new Date(dueDate);
    const diffDays = Math.round((new Date(d.toDateString()) - new Date(today.toDateString())) / 86400000);
    if (diffDays === 0) return "Today";
    if (diffDays === 1) return "Tomorrow";
    if (diffDays === -1) return "Yesterday";
    return d.toLocaleDateString([], { dateStyle: "medium" });
  }

  function formatCreatedLabel(createdDate) {
    if (!createdDate) return "";
    const d = new Date(createdDate + "Z");
    return "Added " + d.toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
  }

  function formatCompletedLabel(completedAt) {
    if (!completedAt) return "";
    const d = new Date(completedAt + "Z");
    return "Completed " + d.toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
  }
  
  async function loadTodos() {
    try {
      const query = buildQuery();
      const res = await apiFetch(`${API_BASE}/filter${query ? "?" + query : ""}`);
      if (!res.ok) throw new Error("Failed to load data, code: " + res.status);
      const todos = await res.json();
      currentTodos = todos;
      renderTodos(todos);
    } catch (err) {
      showError("Error connecting to the API: " + err.message + " — make sure the server is running and CORS is enabled.");
    }
  }

  function renderTodos(todos) {
    const active = todos.filter(t => t.status !== "Completed");
    const completed = todos.filter(t => t.status === "Completed");

    const activeList = document.getElementById("activeList");
    const completedList = document.getElementById("completedList");

    activeList.innerHTML = active.length
      ? active.map(t => renderItem(t, false)).join("")
      : `<div class="empty">You're all caught up! Add a new task to get started.</div>`;

    completedList.innerHTML = completed.length
      ? completed.map(t => renderItem(t, true)).join("")
      : `<div class="empty">No completed tasks yet.</div>`;

    document.getElementById("pendingCount").textContent = `${active.length} pending`;
    document.getElementById("completedCount").textContent = `${completed.length} completed`;
  }

  function renderEditForm(t) {
    const priorities = ["Low", "Medium", "High"];
    const dueValue = t.dueDate ? t.dueDate.slice(0, 10) : "";

    return `
      <div class="edit-form">
        <input type="text" id="editTitle" value="${escapeHtml(t.title)}">
        <div class="edit-row">
          <select id="editPriority">
            ${priorities.map(p => `<option value="${p}" ${t.priority === p ? "selected" : ""}>${p}</option>`).join("")}
          </select>
          <input type="date" id="editDueDate" value="${dueValue}">
        </div>
        <div class="edit-actions">
          <button class="btn-cancel" onclick="cancelEdit()">Cancel</button>
          <button class="btn-save" onclick="saveEdit('${t.id}')">Save</button>
        </div>
      </div>
    `;
  }

  function renderItem(t, isDone) {
    const dueLabel = formatDueLabel(t.dueDate);
    return `
      <div class="todo-item">
        <div class="circle priority-${t.priority} ${isDone ? "done" : ""}"
             onclick="${isDone ? "" : `markComplete('${t.id}')`}">
          ${isDone ? "✓" : ""}
        </div>
        <div class="todo-body">
          ${t.id === editingId
            ? renderEditForm(t)
            : `<div class="todo-title ${isDone ? "done" : ""}">${escapeHtml(t.title)}</div>
               <div class="todo-sub ${isDone ? "done" : ""}">${dueLabel ? `Due ${dueLabel}` : ""}</div>
               <div class="todo-sub ${isDone ? "done" : ""}">${formatCreatedLabel(t.createdDate)}</div>
               ${isDone && t.completedAt ? `<div class="todo-sub done">${formatCompletedLabel(t.completedAt)}</div>` : ""}`}
        </div>
        <div class="tags">
          <span class="tag ${isDone ? "done" : ""}">${t.priority}</span>
        </div>
        ${isDone ? `<button class="delete-btn" title="Move back to active" onclick="reopenTodo('${t.id}')">↺</button>` : ""}
        <button class="delete-btn" onclick="deleteTodo('${t.id}')">✕</button>
        ${isDone ? "" : `<button class="delete-btn" onclick="startEdit('${t.id}')">✎</button>`}

      </div>
    `;
  }

  function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function isTooManyRequests(res) {
  if (res.status === 429) {
    showError("You're going a bit too fast — please wait a few seconds and try again.");
    return true;
  }
  return false;
}

  async function addTodo() {
    const title = document.getElementById("newTitle").value.trim();
    const description = document.getElementById("newDescription").value.trim();
    const priority = document.getElementById("newPriority").value;
    const dueDate = document.getElementById("newDueDate").value;

    if (!title) {
      showError("Title is required");
      return;
    }

    const body = {
      title,
      description: description || null,
      priority: priority || null,
      dueDate: dueDate || null
    };

    try {
      const res = await apiFetch(API_BASE, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      if (isTooManyRequests(res)) return;
      if (!res.ok) {
        const errData = await res.json().catch(() => null);
        throw new Error(errData ? JSON.stringify(errData) : "Failed to add, code: " + res.status);
      }
      document.getElementById("newTitle").value = "";
      document.getElementById("newDescription").value = "";
      document.getElementById("newPriority").value = "";
      document.getElementById("newDueDate").value = "";
      toggleAddPanel();
      loadTodos();
    } catch (err) {
      showError("Error adding task: " + err.message);
    }
  }

  async function markComplete(id) {
    try {
      const res = await apiFetch(`${API_BASE}/${id}/complete`, { method: "PATCH" });
      if (isTooManyRequests(res)) return;
      if (!res.ok) throw new Error("Failed to update, code: " + res.status);
      loadTodos();
    } catch (err) {
      showError("Error updating status: " + err.message);
    }
  }

  async function reopenTodo(id) {
    try {
      const res = await apiFetch(`${API_BASE}/${id}/reopen`, { method: "PATCH" });
      if (isTooManyRequests(res)) return;
      if (!res.ok) throw new Error("Failed to reopen, code: " + res.status);
      loadTodos();
    } catch (err) {
      showError("Error reopening task: " + err.message);
    }
  }

  async function deleteTodo(id) {
    if (!confirm("Are you sure you want to delete this task?")) return;
    try {
      const res = await apiFetch(`${API_BASE}/${id}`, { method: "DELETE" });
      if (isTooManyRequests(res)) return;
      if (!res.ok) throw new Error("Failed to delete, code: " + res.status);
      loadTodos();
    } catch (err) {
      showError("Error deleting task: " + err.message);
    }
  }

  function startEdit(id) {
    editingId = id;
    renderTodos(currentTodos);
  }

  function cancelEdit(id) {
    editingId = null;
    renderTodos(currentTodos);
  }

  async function saveEdit(id) {
    const todo = currentTodos.find(t => t.id === id);
    const newTitle = document.getElementById("editTitle").value.trim();

    if (!newTitle) {
      showError("Title cannot be empty");
      return;
    }

    const newDueDate = document.getElementById("editDueDate").value;

    const body = {
      title: newTitle,
      description: todo.description,
      status: todo.status,
      priority: document.getElementById("editPriority").value,
      dueDate: newDueDate || null
    };

    try {
      const res = await apiFetch(`${API_BASE}/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      if (isTooManyRequests(res)) return;
      if (!res.ok) {
        const errData = await res.json().catch(() => null);
        throw new Error(errData ? JSON.stringify(errData) : "Failed to update, code: " + res.status);
      }
      editingId = null;
      loadTodos();
    } catch (err) {
      showError("Error updating task: " + err.message);
    }
  }

  loadTodos();

  // ===== SignalR real-time notifications =====
  const connection = new signalR.HubConnectionBuilder()
    .withUrl("http://localhost:5093/notificationHub")
    .build();

  function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 4000);
  }

  connection.on("ReceiveNotification", function (message) {
    showToast(message);
    loadTodos(); // refresh the list so the completed item moves automatically
  });

  connection.start()
    .then(() => console.log("Connected to SignalR hub"))
    .catch(err => console.error("SignalR connection error: ", err));
</script>
</body>
</html>
